name: Flutter validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Generate runners and install dependencies
        run: dart tool/setup.dart
      - name: Static analysis
        run: flutter analyze
      - name: Unit and widget tests
        run: flutter test --reporter expanded
      - name: Build demo web application
        run: flutter build web --dart-define=DEMO_MODE=true
